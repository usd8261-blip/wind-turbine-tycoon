name: Build Mobile (Android APK & iOS IPA)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # === 1. ANDROID APK BUILD (NATIVE ENGINE)
  # ==========================================
  build-android:
    name: 🤖 Build Android APK (Native)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 🔨 Compile Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📁 Prepare APK Artifact
        run: |
          mkdir -p output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated!"
            find android/app/build -name "*.apk"
            exit 1
          fi
          cp "$APK_FILE" output/WindTurbineTycoon.apk
          ls -lh output/WindTurbineTycoon.apk

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindTurbineTycoon-Android-APK
          path: output/WindTurbineTycoon.apk
          retention-days: 30

  # ==========================================
  # === 2. iOS IPA BUILD (MACOS RUNNER)
  # ==========================================
  build-ios:
    name: 🍎 Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install npm dependencies
        working-directory: mobile
        run: npm install

      - name: ⚙️ Expo Prebuild iOS (CocoaPods)
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean

      - name: 🔨 Build iOS (Unsigned IPA)
        working-directory: mobile/ios
        run: |
          WORKSPACE_NAME=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          echo "Found workspace: $WORKSPACE_NAME"
          
          # Patch project files to allow unsigned build
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;//g' {} +
          
          SCHEME_NAME="WindTurbineTycoon"
          echo "Target scheme: $SCHEME_NAME"

          xcodebuild build \
            -workspace "$WORKSPACE_NAME" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tee xcodebuild.log || (echo "=== XCODEBUILD FAILED: LAST 80 LINES ===" && tail -n 80 xcodebuild.log && exit 1)

          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          echo "Found App bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found!"
            find build -maxdepth 4
            exit 1
          fi
          du -sh "$APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qr WindTurbineTycoon.ipa Payload
          ls -lh WindTurbineTycoon.ipa
          
          mkdir -p ../../output
          cp WindTurbineTycoon.ipa ../../output/WindTurbineTycoon.ipa
          ls -lh ../../output

      - name: 📤 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindTurbineTycoon-iOS-IPA
          path: output/WindTurbineTycoon.ipa
          retention-days: 30

  # ==========================================
  # === 3. GITHUB RELEASES PUBLISHER
  # ==========================================
  publish-release:
    name: 🚀 Publish to GitHub Releases
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Android APK Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: WindTurbineTycoon-Android-APK
          path: release-files

      - name: 📥 Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: WindTurbineTycoon-iOS-IPA
          path: release-files

      - name: 🏷️ Generate Tag Name
        id: vars
        run: |
          TAG_NAME="v1.0.0-build-${{ github.run_number }}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "⚡ Wind Turbine Tycoon Mobile ${{ steps.vars.outputs.tag }}"
          body: |
            ### 📱 Мобильный релиз Wind Turbine Tycoon (iOS & Android)

            * **🤖 Android**: файл `WindTurbineTycoon.apk` (нативный сверхбыстрый движок, прямая установка на любой Android смартфон)
            * **🍎 iOS**: файл `WindTurbineTycoon.ipa` (установка через AltStore, Sideloadly, Scarlet, TrollStore или личный сертификат)

            #### 🎮 Что включено:
            - Полноценная 60 FPS симуляция ветропарка с сенсорным управлением
            - Система эволюции моделей (Малый ➔ Средний ➔ Гигант ➔ Офшор ➔ Гибрид ➔ Квантовый VAWT)
            - Энергетическая биржа и контракты города
            - R&D Лаборатория науки (аэродинамика, генераторы, ремонтные дроны)
            - Система престижа / Rebirth (+50% к постоянному доходу)
            - Фоновая музыка и тактильная отдача (вибрация)
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
