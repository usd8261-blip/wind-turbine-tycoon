name: Build & Release (PC & Android APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # === 1. WINDOWS PC BUILD (WINDOWS RUNNER)
  # ==========================================
  build-pc:
    name: 💻 Build Windows PC
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 🔨 Compile Java JAR
        run: |
          javac -encoding UTF-8 WindTycoon.java
          jar cfe WindTycoon.jar WindTycoon *.class

      - name: 🚀 Compile Windows C# Launcher (.exe)
        shell: powershell
        run: |
          $csc = (Get-ChildItem -Path "C:\Windows\Microsoft.NET\Framework64\v4.0*" -Filter "csc.exe" -Recurse | Select-Object -First 1).FullName
          & $csc /target:winexe /out:WindTycoon.exe Launcher.cs

      - name: 📦 Package Windows ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output\windows | Out-Null
          Copy-Item WindTycoon.exe output\windows\
          Copy-Item WindTycoon.jar output\windows\
          Copy-Item run.bat output\windows\
          Copy-Item README.md output\windows\
          Copy-Item -Recurse music output\windows\music
          Compress-Archive -Path output\windows\* -DestinationPath output\WindTycoon-Windows.zip
          Copy-Item WindTycoon.exe output\WindTycoon.exe
          Copy-Item WindTycoon.jar output\WindTycoon.jar
          Get-ChildItem output

      - name: 📤 Upload PC Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WindTycoon-PC
          path: |
            output/WindTycoon-Windows.zip
            output/WindTycoon.exe
            output/WindTycoon.jar
          retention-days: 30

  # ==========================================
  # === 2. ANDROID APK BUILD (UBUNTU RUNNER)
  # ==========================================
  build-android:
    name: 🤖 Build Android APK (Native)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 🔨 Compile Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📁 Prepare APK Artifact
        run: |
          mkdir -p output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated!"
            find android/app/build -name "*.apk"
            exit 1
          fi
          cp "$APK_FILE" output/WindTurbineTycoon.apk
          ls -lh output/WindTurbineTycoon.apk

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindTurbineTycoon-Android-APK
          path: output/WindTurbineTycoon.apk
          retention-days: 30

  # ==========================================
  # === 3. UNIFIED GITHUB RELEASES PUBLISHER
  # ==========================================
  publish-release:
    name: 🚀 Publish Release (PC & Android)
    needs: [build-pc, build-android]
    if: always() && (needs.build-pc.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download PC Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: WindTycoon-PC
          path: release-files

      - name: 📥 Download Android APK Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: WindTurbineTycoon-Android-APK
          path: release-files

      - name: 🏷️ Generate Tag Name
        id: vars
        run: |
          TAG_NAME="v1.1.0-build-${{ github.run_number }}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          ls -lh release-files

      - name: 📦 Create Unified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "⚡ Wind Turbine Tycoon ${{ steps.vars.outputs.tag }} (PC & Android)"
          body: |
            ## ⚡ Wind Turbine Tycoon — Официальный Релиз (PC & Android)

            ---

            ### 📦 Файлы для загрузки:

            #### 💻 Windows PC:
            * **`WindTycoon-Windows.zip`** — полный архив с игрой (лаунчер `WindTycoon.exe`, `WindTycoon.jar`, саундтрек и запускной скрипт `run.bat`). Распакуйте и запускайте!
            * **`WindTycoon.exe`** — автономный быстрый исполняемый лаунчер для Windows (запускает игру без консольного окна).
            * **`WindTycoon.jar`** — кроссплатформенный исполняемый файл Java (Windows, Linux, macOS).

            #### 🤖 Android:
            * **`WindTurbineTycoon.apk`** — нативное мобильное приложение (чистый Java движок, 60 FPS Canvas симуляция, сенсорное управление, саундтрек, R&D лаборатория и эволюция турбин). Прямая установка на любой Android смартфон!

            ---

            ### 🎮 Особенности свежего мега-обновления:
            * 🌆 **Эволюция Города (City Skyline):** 4 эпохи развития на заднем плане (Деревня, Индустриальный городок, Современный мегаполис и Нео-Киберпанк с парящими ховеркарами).
            * 📊 **Живой биржевой график:** осциллограф тарифов в реальном времени, неоновая линия тренда и алерты пикового спроса.
            * 💧 **Зеленый Водород & Мега-проекты:** электролизный завод H₂, хранилище, экспорт по $2.40/кг и Орбитальный микроволновый спутник (+400 кВт 24/7 с видимым лазерным лучом энергии).
            * 🌱 **Карбоновые Кредиты (ESG) & Муниципальные полисы:** начисление +1 CC за каждые 1,000 кВт·ч чистой энергии, покупка «Зеленого тарифа», «Эко-надежности», «Гранта на науку» и «Резерва сети».
            * 🎨 **Темы и Скины ветрогенераторов:** Classic Eco, Cyberpunk TRON с неоновыми лопастями, Gold Luxury и Steampunk Brass.
            * 🎵 **HUD Джукбокс & Плеер треков:** встроенный мультитрековый плеер в шапке (переключение треков, пауза, громкость, отображение названий: *Midnight Architecture*, *The Gentle Ascent*, *The Morning Projection*).
            * 🗺️ **Биомы и локации:** Зеленая Долина, Горные Вершины и Морской Шельф с анимированными волнами.
            * 🍂 **Времена года и погода:** Весна, Лето, Осень, Зима (отопительный тариф x1.35 и снегопад).
            * 📋 **Кроссплатформенные сохранения:** экспорт и импорт сохранений в Base64 через буфер обмена.
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
