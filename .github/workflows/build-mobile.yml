name: Build & Release (PC & Android APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # === 1. WINDOWS PC BUILD (WINDOWS RUNNER)
  # ==========================================
  build-pc:
    name: 💻 Build Windows PC
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 🔨 Compile Java JAR
        run: |
          javac -encoding UTF-8 WindTycoon.java
          jar cfe WindTycoon.jar WindTycoon *.class

      - name: 🚀 Compile Windows C# Launcher (.exe)
        shell: powershell
        run: |
          $csc = (Get-ChildItem -Path "C:\Windows\Microsoft.NET\Framework64\v4.0*" -Filter "csc.exe" -Recurse | Select-Object -First 1).FullName
          & $csc /target:winexe /out:WindTycoon.exe Launcher.cs

      - name: 📦 Package Windows ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output\windows | Out-Null
          Copy-Item WindTycoon.exe output\windows\
          Copy-Item WindTycoon.jar output\windows\
          Copy-Item run.bat output\windows\
          Copy-Item README.md output\windows\
          Copy-Item -Recurse music output\windows\music
          Compress-Archive -Path output\windows\* -DestinationPath output\WindTycoon-Windows.zip
          Copy-Item WindTycoon.exe output\WindTycoon.exe
          Copy-Item WindTycoon.jar output\WindTycoon.jar
          Get-ChildItem output

      - name: 📤 Upload PC Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WindTycoon-PC
          path: |
            output/WindTycoon-Windows.zip
            output/WindTycoon.exe
            output/WindTycoon.jar
          retention-days: 30

  # ==========================================
  # === 2. ANDROID APK BUILD (UBUNTU RUNNER)
  # ==========================================
  build-android:
    name: 🤖 Build Android APK (Native)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 🔨 Compile Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📁 Prepare APK Artifact
        run: |
          mkdir -p output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated!"
            find android/app/build -name "*.apk"
            exit 1
          fi
          cp "$APK_FILE" output/WindTurbineTycoon.apk
          ls -lh output/WindTurbineTycoon.apk

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindTurbineTycoon-Android-APK
          path: output/WindTurbineTycoon.apk
          retention-days: 30

  # ==========================================
  # === 3. UNIFIED GITHUB RELEASES PUBLISHER
  # ==========================================
  publish-release:
    name: 🚀 Publish Release (PC & Android)
    needs: [build-pc, build-android]
    if: always() && (needs.build-pc.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download PC Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: WindTycoon-PC
          path: release-files

      - name: 📥 Download Android APK Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: WindTurbineTycoon-Android-APK
          path: release-files

      - name: 🏷️ Generate Tag Name
        id: vars
        run: |
          TAG_NAME="v1.1.0-build-${{ github.run_number }}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          ls -lh release-files

      - name: 📦 Create Unified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "⚡ Wind Turbine Tycoon ${{ steps.vars.outputs.tag }} (PC & Android)"
          body: |
            ## ⚡ Wind Turbine Tycoon — Официальный Релиз (PC & Android)

            ---

            ### 📦 Файлы для загрузки:

            #### 💻 Windows PC:
            * **`WindTycoon-Windows.zip`** — полный архив с игрой (лаунчер `WindTycoon.exe`, `WindTycoon.jar`, саундтрек и запускной скрипт `run.bat`). Распакуйте и запускайте!
            * **`WindTycoon.exe`** — автономный быстрый исполняемый лаунчер для Windows (запускает игру без черного окна консоли).
            * **`WindTycoon.jar`** — кроссплатформенный исполняемый файл Java (Windows, Linux, macOS).

            #### 🤖 Android:
            * **`WindTurbineTycoon.apk`** — нативное мобильное приложение (чистый Java движок, 60 FPS Canvas симуляция, тактильная вибрация, саундтрек, R&D лаборатория и эволюция турбин). Прямая установка на любой Android смартфон!

            ---

            ### 🎮 Особенности версии 1.1.0:
            * 🚀 **Система Эволюции Ветряков:** Малый ($1k) ➔ Средний ($3.2k) ➔ Гигант ($9k) ➔ Офшор ($24k) ➔ Гибрид ($55k) ➔ Квантовый VAWT ($140k).
            * 🔋 **Энергетическая биржа и накопители:** пиковый спрос, продажа энергии, защита от блэкаута.
            * 🔬 **R&D Лаборатория:** аэродинамика лопастей, генераторы, автономные дроны, ИИ прогноза погоды.
            * 👑 **Престиж / IPO:** постоянный несгораемый множитель **+50%** ко всем доходам за каждый Rebirth!
            * 🤖 **Автономные ремонтные дроны:** летают по парку и чинят оборудование электросваркой с искрами.
            * 🎵 **Саундтрек:** встроенная фоновая музыка с плавным зацикливанием и аркадные звуковые эффекты.
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
