plugins {
    id 'com.android.application'
}

android {
    namespace 'com.usd8261.windtycoon'
    compileSdk 34

    defaultConfig {
        applicationId "com.usd8261.windtycoon"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // Use the standard default debug key so release APK can be installed immediately by anyone
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            debuggable true
        }
        release {
            minifyEnabled false
            // If debug.keystore doesn't exist, fallback to signingConfig signingConfigs.debug
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero heavy dependencies! Pure fast native Android!
}
